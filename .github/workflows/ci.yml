name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: "Ubuntu Latest (GCC)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Release helper safeguards
        run: python .github/scripts/test_release.py
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Setup CMake
        run: pip install "cmake==4.4.*"
      - name: Configuring CMake files
        id: building-files
        run: |
          mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release
      - name: Building library
        id: building-lib
        run: |
          cd build && cmake --build . --config Release --target all -j 10 --
      - name: Tests
        id: test-lib
        run: |
          cd build
          ctest -j10 -C Release -T test --output-on-failure
      - name: Cleanup
        id: clean-up
        run: |
          rm -r build

  windows:
    name: "Windows Latest (MSVC)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Setup CMake
        run: pip install "cmake==4.4.*"
      - name: Configuring CMake files
        id: building-files
        run: |
          mkdir build
          cd build
          cmake ..
      - name: Building library
        id: building-lib
        run: |
          cd build
          cmake --build . --config Debug --target casbin gtest gtest_main gmock gmock_main casbintest -j 10 --
      - name: Tests
        id: test-lib
        run: |
          cd build
          ctest -j10 -C Debug -T test --output-on-failure

  macos:
    name: "macOS Latest (AppleClang)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Setup CMake
        run: pip install "cmake==4.4.*"
      - name: Configuring CMake files
        id: building-files
        run: |
          mkdir build && cd build && cmake .. -DCMAKE_INSTALL_PREFIX=~/local
      - name: Building library
        id: building-lib
        run: |
          cd build && cmake --build . --config Debug --target all install -j 10 --
      - name: Tests
        id: test-lib
        run: |
          cd build
          ctest -j10 -C Release -T test --output-on-failure
      - name: Cleanup
        id: clean-up
        run: |
          rm -r build
