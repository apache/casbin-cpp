name: Prepare release candidate

on:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'apache/casbin-cpp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the unsigned source candidate
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc[1-9][0-9]*$ ]]; then
            echo '::error::Expected vX.Y.Z-rcN.'
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          name="apache-casbin-cpp-${version}-incubating-src"
          for legal in LICENSE NOTICE DISCLAIMER; do
            test -s "$legal"
          done
          mkdir dist
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" HEAD -- . \
            ':(exclude).github/vcpkg/casbin/portfile.cmake' \
            ':(exclude).github/vcpkg/casbin/vcpkg.json'
          cd dist
          listing="$(tar -tzf "${name}.tar.gz")"
          for legal in LICENSE NOTICE DISCLAIMER; do
            grep -qx "${name}/${legal}" <<< "$listing"
          done
          sha512sum "${name}.tar.gz" > "${name}.tar.gz.sha512"
          sha512sum -c "${name}.tar.gz.sha512"

      - name: Retain the source candidate for the release manager
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-candidate-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
